<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <a class="update" id="update" hidden target="_blank">
    <span><span data-i18n="newVersion"></span> <b id="update-version"></b></span>
    <span class="update-cta" data-i18n="download"></span>
  </a>

  <header>
    <h1>Clearstream</h1>
    <button class="icon-btn" id="settings-btn" data-i18n-title="settings" data-i18n-aria-label="settings">⚙</button>
    <label class="switch" data-i18n-title="toggleTitle">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </header>

  <main id="main-view">
    <p class="status" id="status"></p>

    <section class="stats">
      <div class="stat">
        <span class="num" id="tab">0</span>
        <span class="label" data-i18n="thisPage"></span>
      </div>
      <div class="stat">
        <span class="num" id="total">0</span>
        <span class="label" data-i18n="total"></span>
      </div>
    </section>
    <p class="hint">
      <span data-i18n="blockedRequests"></span>
      <button class="help-btn" id="brave-help" hidden aria-expanded="false" aria-controls="brave-note" data-i18n-aria-label="braveHelpLabel">?</button>
    </p>
    <p class="brave-note" id="brave-note" hidden data-i18n="braveNote"></p>

    <p class="warning" id="twitch-conflict" hidden role="status"></p>

    <p class="reload-hint" id="reload-hint" hidden>
      <span data-i18n="reloadHint"></span>
      <button class="text-btn" id="reload-btn" data-i18n="reloadPage"></button>
    </p>
  </main>

  <section id="settings-view" hidden>
    <h2 data-i18n="settings"></h2>

    <div class="setting">
      <label class="setting-row" for="language">
        <span data-i18n="language"></span>
        <select id="language">
          <option value="auto" data-i18n="languageAuto"></option>
          <option value="en">English</option>
          <option value="tr">Türkçe</option>
        </select>
      </label>
    </div>

    <div class="setting">
      <label class="setting-row" for="twitch-toggle">
        <span data-i18n="twitchSetting"></span>
        <span class="switch small">
          <input type="checkbox" id="twitch-toggle">
          <span class="slider"></span>
        </span>
      </label>
      <p class="setting-note" data-i18n="twitchNote"></p>
    </div>

    <div class="setting">
      <div class="setting-row">
        <span data-i18n="version"></span>
        <span class="muted" id="version"></span>
      </div>
      <button class="btn" id="check-update" data-i18n="checkUpdates"></button>
      <p class="check-result" id="check-result" aria-live="polite"></p>
    </div>

    <a class="link" target="_blank" href="https://github.com/magef1x/clearstream" data-i18n="githubPage"></a>
  </section>

  <script src="popup.js"></script>
</body>
</html>
