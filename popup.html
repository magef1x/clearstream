<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <a class="update" id="update" hidden target="_blank">
    <span>Yeni sürüm çıktı: <b id="update-version"></b></span>
    <span class="update-cta">İndir ↓</span>
  </a>

  <header>
    <span class="logo">C</span>
    <h1>Clearstream</h1>
    <button class="icon-btn" id="settings-btn" title="Ayarlar" aria-label="Ayarlar">⚙</button>
    <label class="switch" title="Aç / Kapat">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </header>

  <main id="main-view">
    <p class="status" id="status">Koruma açık</p>

    <section class="stats">
      <div class="stat">
        <span class="num" id="tab">0</span>
        <span class="label">Bu sayfada</span>
      </div>
      <div class="stat">
        <span class="num" id="total">0</span>
        <span class="label">Toplam</span>
      </div>
    </section>
    <p class="hint">Engellenen reklam isteği</p>
  </main>

  <section id="settings-view" hidden>
    <h2>Ayarlar</h2>

    <div class="setting">
      <div class="setting-row">
        <span>Sürüm</span>
        <span class="muted" id="version"></span>
      </div>
      <button class="btn" id="check-update">Güncellemeleri kontrol et</button>
      <p class="check-result" id="check-result" aria-live="polite"></p>
    </div>

    <a class="link" target="_blank" href="https://github.com/magef1x/clearstream">GitHub sayfası ↗</a>
  </section>

  <script src="popup.js"></script>
</body>
</html>
